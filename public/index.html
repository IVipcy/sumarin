<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>要約チェッカーさまりん ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <div class="container">
      <header class="header">
        <div class="mascot">🏺</div>
        <h1>要約チェッカーさまりん</h1>
        <p class="subtitle">「未来につなぐ工芸品」の200字要約をチェックしよう！</p>
      </header>

      <main>
        <section class="card input-section">
          <h2>① 書いた要約を入れよう</h2>

          <div class="field-group">
            <label for="summaryText">書いた要約</label>
            <textarea
              id="summaryText"
              rows="8"
              placeholder="「未来につなぐ工芸品」の要約（160〜200字）をここに書こう"
            ></textarea>
            <p id="charCount" class="char-count">0字（目安：160〜200字）</p>
          </div>

          <button id="evaluateBtn" class="evaluate-btn">
            ⭐ 評価する！
          </button>
        </section>

        <section id="loading" class="loading hidden">
          <div class="spinner"></div>
          <p>さまりんがチェック中…</p>
        </section>

        <section id="results" class="card results-section hidden">
          <h2>② 評価結果</h2>

          <div class="overall-grade">
            <div id="gradeBadge" class="grade-badge">A</div>
            <p id="gradeLabel" class="grade-label"></p>
          </div>

          <div class="overall-section">
            <h3>📝 総評</h3>
            <p id="overallComment" class="overall-comment"></p>
          </div>

          <h3 class="axes-title">🔍 チェックした4つのこと</h3>
          <div id="axesResults" class="axes-results"></div>

          <div class="improved-section">
            <h3>✏️ こう書くともっとよくなるよ！</h3>
            <div id="improvedSummary" class="improved-text"></div>
            <p id="improvedMeta" class="improved-meta"></p>
          </div>
        </section>

        <section id="error" class="error-box hidden"></section>
      </main>

      <footer>
        <p>小4 国語「未来につなぐ工芸品」／200字要約</p>
      </footer>
    </div>

    <script src="vendor/confetti.browser.js"></script>
    <script src="app.js"></script>
  </body>
</html>
